# n8n + Postgres for local/dev. n8n version is PINNED (2.49.8); bump it deliberately, together with scripts/ tests.
# Run from the repo root:
#   cp .env.example .env   # then edit the two required values
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
# (or just `docker compose up -d` from the root: the root docker-compose.yml includes this file)
# Everything is bound to 127.0.0.1; put a TLS reverse proxy in front before exposing anything.
name: workflow-automation

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: workflow_automation
    volumes:
      - postgres_data:/var/lib/postgresql
      # Every top-level *.sql here runs once, on first start of an empty volume, in filename order.
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow_automation"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.49.8
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: workflow
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Copy .env.example to .env and set N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # http only on localhost; set to true (default) behind TLS.
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Saigon}
      TZ: ${GENERIC_TIMEZONE:-Asia/Saigon}
      # Keep execution history bounded (disk growth is the usual surprise in production).
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
