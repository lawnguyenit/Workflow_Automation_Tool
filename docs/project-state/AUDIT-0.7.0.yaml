      - "workflows/n8n/lead-management-google-form.manual-preview.json:29-32"
      - "docs/project-state/verification.md:6,21-26"
    impact: "PII is removed from workflow API responses and n8n export disables saved success/error execution data, but actual instance policy/import behavior, credential storage, and manual execution retention were not inspected in UI."
    reproduction: "Static export review only; n8n UI sign-in prevents import/runtime inspection."
    owner_next_action: "Workflow lead: verify saved execution/credential policies in n8n UI before any real account connection or PII processing."
