modules:
  - id: "source.google_form_response"
    result: "pass"
    contract: "Accepts row_number and header-keyed row, validates exact configured headers/value types, maps the five lead fields, and derives event key from spreadsheet/tab/row. Pure mapper; no Google calls."
    evidence:
      - "src/workflow_automation/modules/input/google_form_response.py:27-111"
      - "docs/modules/google-form-response.md:5-25"
      - "tests/unit/test_google_form_response.py"
    limits:
      - "Does not use an immutable response ID; row number is only stable under append-only, no-reorder/no-delete/no-insert practice."
      - "Module itself does not validate change_type; the n8n IF node is the only added-row gate in this composition."
      - "No live Google API/OAuth/trigger execution."
  - id: "lead.intake"
    result: "pass"
    contract: "Trims and normalizes bounded fields; flags missing/invalid email; always adds qualification_criteria_not_configured and returns PARTIAL/manual-review semantics."
    evidence:
      - "src/workflow_automation/modules/processing/lead_intake.py:21-75"
      - "tests/unit/test_lead_management.py"
    limits:
      - "Phone formatting cleanup is not country-aware or strict E.164 validation."
      - "Persists normalized PII downstream; database protection and retention are external responsibilities."
  - id: "lead.qualify"
    result: "risk"
    contract: "Requires an explicit bounded rubric, allowed classes and required fields; model receives enquiry/service text without separately mapped contact fields; failure/uncertainty holds for review."
    evidence:
      - "src/workflow_automation/modules/processing/lead_qualify.py"
      - "docs/modules/lead-qualification.md:5-20"
      - "tests/unit/test_lead_qualify.py"
    limits:
      - "No approved rubric or live API account; composed source path classifies as review-required."
      - "No durable call ledger, spend ceiling, or cache; REAL replay can incur repeated charges."
      - "Free text may itself contain personal information; no live model quality/cost/privacy behavior verified."
  - id: "lead.store"
    result: "pass"
    contract: "PostgreSQL first-write-wins unique event key; same fingerprint is duplicate; changed payload becomes PAYLOAD_CONFLICT_REVIEW; DRY_RUN/REPLAY do not persist."
    evidence:
      - "src/workflow_automation/modules/storage/postgres_lead_store.py:35-145"
      - "tests/integration/google_form_lead_postgres.py:68-101"
    limits:
      - "Dedupes source events only; not person, CRM, or message effects."
      - "Synthetic Docker/PostgreSQL evidence only; no load, retention, backup/restore or production monitoring checks."
