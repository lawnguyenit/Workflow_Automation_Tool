failure_report_applicability:
  - source: "Installed n8n 2.41.6 GoogleSheetsTrigger.node.js"
    applicability: "verified_target_source"
    finding: "Row Added or Updated calls Drive revisions API and requires edit access to the Sheet; on missing file permission the node emits an explicit edit-access error. The node's OAuth credential source defaults to drive, drive.file, spreadsheets, and drive.metadata scopes. The exported workflow uses this event because row_number/change_type are needed for its mapper."
    impact: "The user's private response Sheet is owned by their Google account, but authorizing the n8n trigger would grant broad Drive capability and the node needs edit permission. Neither requirement was visible as a pre-connect decision in the workflow artifact. No credential was connected during this audit."
    next_action: "Do not connect or activate this trigger until the user is told the exact permission/scope and an alternative with narrower read-only access or immutable response identity is evaluated."
