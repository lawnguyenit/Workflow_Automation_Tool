blocking_findings:
  - id: "AUD-0701"
    severity: "high"
    result: "risk"
    title: "Google trigger requires edit access and grants broad Drive OAuth scopes"
    evidence:
      - "Installed n8n 2.41.6 source: `GoogleSheetsTrigger.node.js:411-423,558-563`; `GoogleSheetsTriggerOAuth2Api.credentials.js` defines drive, drive.file, spreadsheets, drive.metadata scopes."
      - "workflows/n8n/lead-management-google-form.local.json:8-21 selects event anyUpdate."
    impact: "Connecting this trigger could authorize the n8n credential for broad Drive access, and source explicitly requires Sheet edit permission for this event. This exceeds the apparent need to read form responses and creates an account-level security decision that has not been approved."
    reproduction: "Read the installed trigger and credential source inside the running n8n container; confirmed API revision listing, explicit edit-access error, and default scopes. No credentials were connected and no user file permissions were changed."
    owner_next_action: "Workflow lead: document the exact permission before any OAuth setup and evaluate a read-only source using immutable event IDs. User: decide whether to authorize the required account scope/edit access if no narrower viable option is found."
  - id: "AUD-0702"
    severity: "high"
    result: "risk"
    title: "Spreadsheet row number is not a durable response identity"
    evidence:
      - "src/workflow_automation/modules/input/google_form_response.py:31-33,58-75"
      - "docs/modules/google-form-response.md:9-17"
      - "n8n 2.41.6 installed source: `GoogleSheetsTrigger.utils.js:compareRevisions` uses row indices as row_number."
    impact: "Sorting, inserting or deleting rows can change/reuse row numbers. A different response may then be treated as an existing event (duplicate or payload conflict), or identity may drift. The current integration proves retries only when the row position is unchanged."
    reproduction: "Static inspection of key derivation and n8n row index calculation; synthetic integration repeats the same key only and does not exercise reorder/delete/insert."
    owner_next_action: "Workflow lead: seek an immutable Form response identifier or a durable identity registry. If none exists, make append-only/no-sort constraints explicit and add mutation/reconciliation tests before real use."
  - id: "AUD-0703"
    severity: "high"
    result: "fail"
    title: "The implementation is a partial local reference, not the requested lead-management delivery"
    evidence:
      - "src/workflow_automation/definitions.py:209-235"
      - "docs/modules/lead-management-reference.md:5-20,37-47"
      - "docs/project-state/verification.md:21-26"
    impact: "The brief's core CRM update, contact/custom fields/tags/opportunity, follow-up and stop conditions, monitoring/alerts, provider-failure recovery, and end-to-end business run cannot occur. A prospect-facing delivery claim would be inaccurate."
    reproduction: "Compared the supplied brief against the actual workflow graph and account inventory; graph ends at PostgreSQL, no side-effect/suppression/alert steps are present."
    owner_next_action: "Workflow lead: retain the incomplete disposition; user: provide CRM/account/business decisions and credentials through secure UI as applicable; only then complete and re-audit."
