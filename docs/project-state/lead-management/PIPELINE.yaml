    producer: CAP-007
    consumer: CAP-008
    compatibility: blocked
    shape_cardinality_ordering: "Gate check occurs immediately before each send and uses a stable message/effect key."
    context_provenance: "A passing point-in-time check must be tied to exact subject, sequence step, and stop state."
