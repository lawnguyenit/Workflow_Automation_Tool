    side_effects_and_data_boundaries: "External send follows local gate; an in-flight send cannot be recalled by a later stop event."
    verification: ["No sender/gate composition or authoritative stop events."]
  - id: EDGE-008
    producer: CAP-006
    consumer: CAP-009
    compatibility: planned
    shape_cardinality_ordering: "Sanitized run/correlation ID plus CRM step outcome and retryability."
    context_provenance: "Avoid PII, private Form ID, provider tokens, message body, or raw provider payload in alerts."
    partial_error_retry_replay: "Distinguish known failure from unknown remote outcome and route to safe retry or reconciliation."
    side_effects_and_data_boundaries: "Alert and operator store are separate effects; alert failure cannot erase the original failure state."
    verification: ["No composed lead alert path."]
stop_and_recovery:
  - "OAuth branding exists in External/Testing mode. Do not add Forms scopes or create a consent grant until the owner chooses the account-level access boundary; then verify only the Forms body/responses read-only scopes."
  - "Do not activate the poller or read any Form responses until OAuth scopes and the private Form ID are checked; use synthetic-only response data."
  - "Do not run GHL writes until account, Location, matching, custom fields, tags, pipeline, stage, and opportunity rules are approved."
  - "Do not make paid model calls until API credential, rubric, privacy decision, and provider-side monetary spend cap are configured."
  - "Do not enroll/send follow-up until approved copy, channel, cadence, booking link, consent, stop-event sources, and recovery owner are configured."
  - "Unknown external outcome requires reconciliation; do not blindly retry or advance source/cursor as fully complete."
  - "Checkpoint lease expiry can replay source work; every future remote side effect needs its own durable idempotency/reconciliation guard."
  - "Alert destination/recovery owner and dead-letter/runbook remain unassigned."
workflow_success_condition: >-
  One owner-approved synthetic response is read through the authorized Forms API,
  mapped, validated, qualified under an approved rubric (or explicitly sent to
  manual review), stored once, written to the correct GHL contact/opportunity,
  and sent the approved acknowledgement/follow-up exactly once unless an authoritative
  stop event blocks it; failures alert an owner and recover without duplicate effects;
  secret-free export and handover are reviewed and accepted by the user.
unresolved_items:
  - "Google policy acceptance is complete for private test branding. Account-level Forms scope choice, OAuth client/grant, and private Form ID remain owner access gates."
  - "Local API bearer credential is not assigned to n8n MOCK/REAL requests."
  - "GHL/AI accounts and all business-specific mappings/rubric/budgets are absent."
  - "No durable composed CRM/send outbox, authoritative stop-event ingestion, alert destination, or tested operator recovery path exists."
  - "User acceptance remains outstanding."
