    producer: CAP-001
    consumer: CAP-002
    compatibility: planned
    shape_cardinality_ordering: "One matching Form schema plus one FormResponse item at a time; exact API question IDs map to canonical fields."
    context_provenance: "Preserve private form identity and stable responseId event identity; do not log response body."
    partial_error_retry_replay: "Page/API failure stops before timestamp checkpoint commit; inclusive timestamp polling can replay; source event key absorbs local replay."
    side_effects_and_data_boundaries: "Read-only Google request in n8n; OAuth credential stays in n8n, not export/API."
    verification: ["Static graph and synthetic mapper tests; live source edge unexecuted."]
