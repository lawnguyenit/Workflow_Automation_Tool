question_and_scope: "Inspect existing Forms source, lead modules, local runtime, account gates, and failure semantics without calling external providers."
method_and_environment: "Repository source/docs, n8n 2.41.6 workflow records, Docker Compose API/PostgreSQL, synthetic integration harnesses."
access_basis: "User authorized a private read-only Forms API portfolio setup and accepted the separate Google API Services User Data Policy for private OAuth branding. No Forms scopes or OAuth grant are configured. The user is deciding whether the broad account-level Forms scope applies to the current account or a dedicated test account."
