    url_or_control: "src/workflow_automation/definitions.py; docs/modules/lead-management-reference.md"
    observation: "The current Forms API composition ends at map → intake → qualification/review → PostgreSQL store."
    evidence_type: observed
  - step: "Inspect current n8n and local service state."
    url_or_control: "Docker Compose health endpoints; n8n workflow list"
    observation: "API and n8n health endpoints return 200; PostgreSQL is healthy; no workflow is active. The Forms API poller is recorded as an inactive 18-node workflow with placeholder Form ID and no credentials."
    evidence_type: observed
  - step: "Inspect Google setup status."
    url_or_control: "Google Cloud Console setup recorded in project-state verification"
    observation: "Dedicated project and Forms API are enabled. Auth branding exists in External/Testing mode with only the owner's account as a test user. Data Access has no scopes. No OAuth client/grant/request or Form response read."
