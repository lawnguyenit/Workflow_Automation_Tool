result_shape: "Forms mapper emits canonical lead with source identity `<formId>:<responseId>`; synthetic mapper-to-PostgreSQL integration verifies first store, same-event duplicate, changed-payload review, and cleanup."
pagination_and_rendering:
  behavior: "Inactive n8n poller uses Forms API pagination, a PostgreSQL per-source lease/checkpoint, timestamp cursor, and stable source-event storage identity."
  coverage: "Synthetic checkpoint integration verifies lease/retry/concurrency/recovery. No live Forms pagination, API response shape, or runtime cursor behavior has been executed."
  limits:
    - "900-second lease expiry cannot cancel downstream work already in progress."
    - "Google response pages and n8n Forms API HTTP failures remain live-unverified."
    - "Source-event dedupe is not person-level, CRM, or message idempotency."
access_and_failures:
  auth_or_session: "OAuth branding is configured but no Forms scopes, OAuth client, or grant exist. Local API MOCK/REAL calls also lack an n8n bearer credential."
  captcha_denial_throttle_or_robot_control: "not_applicable to the selected official API path; provider quota/rate response still needs live validation."
  observed_errors:
    - "No external provider error has been exercised in the poller."
    - "Synthetic module tests cover bounded validation, unknown remote outcomes, fail-closed state, and reconciliation contracts separately."
candidate_method:
  name: "Official Google Forms API polling from n8n, then local workflow API"
  rationale: "Owner-selected read-only scopes; no public callback required for the local polling workflow; reusable mapper and checkpoint modules already exist."
  confidence: medium
module_and_edge_implications:
  - "Reuse source.google_forms_api_response and state.source_poll_checkpoint; keep OAuth in n8n and secrets out of exports."
  - "Reuse lead.intake, lead.qualify, and lead.store; real model execution remains owner/rubric/budget gated."
  - "GHL adapters are separate and require account-specific mappings before composition."
  - "Follow-up gate and Gmail sender are separate; authoritative lifecycle events and policy must be provided."
  - "Because the poller can commit after local storage, any added CRM/send effects need durable per-effect idempotency, retry/reconciliation and alerting before the cursor can claim full completion."
unknowns:
  - question: "Which Google account should receive the two Forms read-only scopes?"
    owner: user
    verification_or_stop_condition: "Wait for the owner to choose the current account or a dedicated account shared only to the test Form; then inspect exact read-only scopes before any consent grant."
  - question: "Which GHL contact/field/tag/pipeline rules should be used?"
    owner: user
    verification_or_stop_condition: "Wait for a GHL test Location and explicit mapping/match decisions."
  - question: "What rubric/model budget authorizes automatic qualification?"
    owner: user
    verification_or_stop_condition: "No paid API call until credential, rubric, and provider-side USD cap exist."
  - question: "What message policy, booking link, and lifecycle events govern sending?"
    owner: user
    verification_or_stop_condition: "No lead follow-up until content/channel/enrollment policy and stop-event sources are approved."
stop_conditions:
  - "OAuth consent/credential or private Form ID is not present."
  - "Any live response includes real prospect data; stop current portfolio processing and revisit purpose/retention/access controls first."
  - "GHL matching/pipeline rules or message permission are unspecified."
next_owner_action: "Workflow lead may prepare the blocked-edge pipeline design; owner must resolve the listed access and business-policy decisions before live operation."
