modules:
  - id: "source.google_forms_api_response"
    result: "pass"
    contract: "Pure one-event mapper. Accepts exactly form_id, matching Form schema, and one response; maps one text answer per configured exact question title; derives stable event key from formId:responseId; rejects mismatches, duplicate/missing titles, malformed/multiple/non-text answers, and oversized fields. It performs no network calls."
    evidence:
      - "src/workflow_automation/modules/input/google_forms_api_response.py"
      - "tests/unit/test_google_forms_api_response.py"
      - "docs/modules/google-forms-api-response.md"
    limits:
      - "No live Forms API response or OAuth execution; current private form has no responses."
      - "The n8n caller's read-only scopes, runtime response shape, and provider pagination have not been exercised."
  - id: "lead.intake"
    result: "pass"
    contract: "Normalizes bounded strings/email/phone and flags missing/invalid fields for human review without fabricating values; emits a lead for the next step."
    evidence:
      - "src/workflow_automation/modules/processing/lead_intake.py"
      - "tests/unit/test_lead_management.py"
      - "tests/integration/google_forms_api_lead_postgres.py"
    limits:
      - "Phone cleanup is not full country-specific validation."
      - "Lead data is stored in local PostgreSQL; retention/access policy is not production-approved."
  - id: "lead.qualify"
    result: "risk"
    contract: "Requires explicit bounded criteria; fixture/replay modes avoid provider calls; REAL mode sends enquiry text with strict structured output, excluding separately mapped direct contact fields. Durable ledger claims stable event before provider call, caches identical redacted results, holds changed or unknown events, and atomically limits UTC-day request count."
    evidence:
      - "src/workflow_automation/modules/processing/lead_qualify.py"
      - "src/workflow_automation/infrastructure/postgres_lead_qualification_ledger.py"
      - "tests/unit/test_lead_qualify.py"
      - "tests/integration/lead_qualification_ledger_postgres.py"
      - "docs/modules/lead-qualification.md"
    limits:
      - "No approved rubric, OpenAI API credential, per-day cap, provider USD budget, or live request."
      - "Enquiry free text can contain identifying details; the model transfer has not been live privacy-reviewed."
      - "The request cap is not a monetary spend ceiling. Unknown claims require operator reconciliation."
  - id: "lead.store"
    result: "pass"
    contract: "PostgreSQL first-write-wins persistence keyed by source event; same-key same-payload is duplicate and changed payload is held for review."
    evidence:
      - "src/workflow_automation/modules/storage/postgres_lead_store.py"
      - "infra/postgres/migrations/002-lead-management.sql"
      - "tests/integration/google_forms_api_lead_postgres.py"
    limits:
      - "Deduplication is per source event, not person or CRM entity."
      - "No load, failover, backup/restore, retention/deletion, or live-database capacity claim."
  - id: "crm.ghl_upsert_contact"
    result: "risk"
    contract: "Separately callable generic HighLevel contact create/update adapter; configured Location and provider credentials required in REAL mode. Not part of the lead workflow."
    evidence:
      - "src/workflow_automation/modules/crm/ghl_upsert_contact.py"
      - "tests/unit/test_ghl_upsert_contact.py"
      - "docs/modules/ghl-contact-upsert.md"
    limits:
      - "Synthetic HTTP tests only; no account, live create/update, approved duplicate semantics, or custom-field mapping."
  - id: "crm.ghl_contact_tags"
    result: "risk"
    contract: "Separately callable additive API v3 contact-tag writer; 1–50 unique bounded tags; REAL calls require contacts.write credential and shared PostgreSQL effect guard. Serializes same Location/contact work through that guard; unknown outcomes hold for reconciliation."
    evidence:
      - "src/workflow_automation/modules/crm/ghl_contact_tags.py"
      - "tests/unit/test_ghl_contact_tags.py"
      - "tests/integration/ghl_contact_tags_postgres.py"
      - "docs/modules/ghl-contact-tags.md"
      - "docs/project-state/verification.md: 0.9 integration summary"
    limits:
      - "The Docker integration uses synthetic HTTP, not HighLevel."
      - "No account-approved tag list or live CRM write. A later confirmed-success call is not provider-idempotent; direct writers outside the shared DB guard are not serialized."
      - "429 is marked retryable, but scheduler/backoff is caller-owned."
  - id: "crm.ghl_upsert_opportunity"
    result: "risk"
    contract: "Separately callable open-opportunity search/create/update adapter with a PostgreSQL effect guard; policy is exact Location/contact/pipeline, create on zero open matches, update one, ambiguous results to review."
    evidence:
      - "src/workflow_automation/modules/crm/ghl_upsert_opportunity.py"
      - "tests/unit/test_ghl_upsert_opportunity.py"
      - "docs/modules/ghl-opportunity-upsert.md"
      - "docs/project-state/verification.md: release 0.5.0 synthetic PostgreSQL guard evidence"
      - "docs/project-state/decisions.md: DEC-009"
    limits:
      - "Policy remains proposed; no user account/pipeline/stage, no live API, and not composed into lead graph."
      - "Guard coordinates only callers sharing the configured database; provider-side/external edits and load/failover behavior are untested."
  - id: "gmail.send"
    result: "risk"
    contract: "Separately callable Gmail API sender with PostgreSQL outbox/idempotency/unknown-outcome guard; not bound to the lead graph."
    evidence:
      - "src/workflow_automation/modules/output/gmail_send.py"
      - "tests/integration/gmail_send_postgres.py"
      - "docs/modules/gmail-send.md"
      - "docs/project-state/user-intent.md: account test boundary"
    limits:
      - "No local Gmail OAuth credential and no lead email was sent. The one self-addressed Codex Gmail app message is separate evidence."
      - "No reply/booking/opt-out/manual-pause suppression or follow-up sequence."

