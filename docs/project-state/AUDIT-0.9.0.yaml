job_id: "lead-management-ghl-upwork-practice"
auditor: "independent read-only audit subagent"
last_updated: "2026-10-03"
independent_of_implementation: true
scope:
  target: "The supplied Upwork lead-management brief and the approved synthetic Forms API reference instance at intended release 0.9.0."
  authority:
    - "Original Upwork brief in conversation: one enquiry source, validation, AI qualification, GHL contact/custom-field/tag/opportunity updates, follow-up with stop conditions, monitoring/recovery, export/docs/handover, and successful test enquiry."
    - "docs/project-state/user-intent.md and decisions.md, especially DEC-007 through DEC-011."
    - "User selected Google Forms API read-only access; form is private/unpublished and test-only. Live external writes are not authorized by this selection."
    - "User has Gmail/Outlook, but no identified GHL/CRM, no separate OpenAI API credential, no public endpoint. VPS is excluded. Only synthetic local data is in scope."
  canonical_artifacts:
    status: "not_present"
    note: "No JOB_SPEC.yaml, DECISIONS.yaml, DISCOVERY.yaml, PIPELINE.yaml, or TASKS.yaml exists in this tool project. Project-state markdown and the initial plan were used as the available authority/evidence records."
  constraints:
    - "Do not publish the Form, expose a tunnel/endpoint, use real prospect data, or write to an external CRM/provider."
    - "Do not treat the separately authorized self-addressed Gmail app test as evidence that this local workflow or Gmail module sent a lead email."

findings:
  - id: "AUD-0901"
    severity: "high"
    result: "fail"
    title: "The release is a local reference, not the requested working GHL lead-management delivery."
    evidence:
      - "docs/modules/lead-management-reference.md: Current graph ends at PostgreSQL; it explicitly says no live LLM, CRM write, or message is made."
      - "src/workflow_automation/definitions.py: LEAD_GOOGLE_FORMS_API_WORKFLOW has map → intake → qualify → store only."
      - "docs/project-state/implementation-state.md: GHL adapters exist separately and are not composed; sender and suppression workflow are absent."
      - "docs/project-state/verification.md: release 0.9.0 evidence records synthetic tests and no live Google, OpenAI, or HighLevel requests."
    impact: "The expected business outcome—one enquiry proceeds through qualification, CRM update, and correct follow-up—cannot currently occur. The project must not be represented as a completed Upwork delivery."
    reproduction: "Compared the brief's expected path to the registered workflow definition, n8n export, module instances, and current verification record."
    owner_next_action: "Workflow lead: keep the deliverable marked partial. Continue after the user supplies a CRM/GHL test account and the missing owner-controlled business settings; re-audit after a composed, authorized end-to-end run."
  - id: "AUD-0902"
    severity: "high"
    result: "decision_needed"
    title: "CRM target and business mappings are absent."
    evidence:
      - "docs/project-state/user-intent.md: no existing CRM/GHL account identified."
      - "docs/project-state/decisions.md: DEC-009 is explicitly a proposed opportunity matching default, not user-approved policy."
      - "docs/modules/lead-management-reference.md: no Location, field mapping, approved tags, pipeline, or stage configured."
      - "src/workflow_automation/registry_factory.py: optional generic GHL instances bind only with a Location ID; they are not workflow steps."
    impact: "No contact, custom-field, tag, or opportunity mapping can be safely selected or validated. A conservative adapter default cannot stand in for the account owner's policy."
    reproduction: "Inspected registry bindings, the composed graph, decisions, and account inventory. No live GHL call was made."
    owner_next_action: "User: identify/provision a test CRM/GHL Location and approve field mappings, duplicate policy, tag names, pipeline/stage, and opportunity matching behavior. Workflow lead: then compose and test the selected modules."
  - id: "AUD-0903"
    severity: "high"
    result: "decision_needed"
    title: "Follow-up content and stop-condition behavior are not implemented."
    evidence:
      - "docs/modules/lead-management-reference.md: no reply, booking, opt-out, or manual-pause event source or suppression scheduler is wired."
      - "src/workflow_automation/definitions.py: the lead workflow ends after store; `gmail.send` is a separate capability."
      - "docs/project-state/user-intent.md: only one self-addressed app email was authorized; that is not authorization for prospect messages."
    impact: "The brief's follow-up sequence cannot run, and there is no durable state that can stop it after reply, booking, opt-out, or manual pause."
    reproduction: "Inspected workflow definitions and module instances; no send, inbound reply, booking, opt-out, pause, or suppression state appears in the lead graph."
    owner_next_action: "User: approve exact message content, recipient rules, booking link, and stop semantics. Workflow lead: implement durable suppression and failure/replay tests before any outbound message is enabled."
  - id: "AUD-0904"
    severity: "high"
    result: "not_tested"
    title: "Google Forms OAuth, response retrieval, and n8n import/runtime have not been exercised."
    evidence:
      - "workflows/n8n/lead-management-google-forms-api.local.json: inactive workflow, placeholder Form ID, generic OAuth placeholders, DRY_RUN default."
      - "docs/modules/google-forms-api-response.md: no OAuth consent, Forms API request, actual response, n8n import, or activation."
      - "docs/project-state/user-intent.md: the private form is unpublished and has zero responses; the user selected read-only Forms API access."
    impact: "The source design is bounded to read-only Forms scopes, but it does not yet show that credentials/scopes, real Form schema, timestamp pagination, node expressions, or response shape work in the target n8n instance."
    reproduction: "Static review of the export and mapper plus unit tests; no Google endpoint or n8n UI execution occurred."
    owner_next_action: "Workflow lead: after owner OAuth setup, verify against the private test Form with a synthetic response, import/run the inactive workflow, and capture sanitized evidence. Keep the Form unpublished and do not expose an endpoint."
  - id: "AUD-0905"
    severity: "medium"
    result: "risk"
    title: "The Forms polling cursor is process-local n8n static state and overlapping executions are not serialized."
    evidence:
      - "workflows/n8n/lead-management-google-forms-api.local.json: cursor held in `$getWorkflowStaticData('global')`, five-minute schedule, inclusive timestamp filter, and cursor update after accepted batch."
      - "docs/modules/google-forms-api-response.md: explicitly bounds this to a single-instance, low-volume reference and says it is not an atomic distributed checkpoint."
    impact: "Concurrent executions or multi-worker/high-volume deployment may race cursor state or repeat a batch. Stable `<formId>:<responseId>` identity and PostgreSQL deduplicate stored source events, but do not make the checkpoint distributed or prevent repeated upstream work."
    reproduction: "Static inspection; no n8n runtime, overlapping poll, multi-worker, quota, or backlog test was performed."
    owner_next_action: "Workflow lead: before multi-worker or production use, replace static cursor with an atomic durable checkpoint/lease and test partial batches, overlap, replay, and recovery."
  - id: "AUD-0906"
    severity: "medium"
    result: "risk"
    title: "The qualification call cap is a request-count limit, not a financial spend budget."
    evidence:
      - "src/workflow_automation/infrastructure/postgres_lead_qualification_ledger.py: reserves UTC-day attempts by model."
      - "docs/modules/lead-qualification.md and docs/releases/0.9.0.md: explicitly state USD cost is neither collected nor enforced."
      - "docs/project-state/decisions.md: DEC-011 requires an explicit call count and says provider-side USD limits remain needed."
    impact: "The added ledger addresses duplicate/ambiguous retry behavior and per-model request count, but it cannot guarantee a dollar ceiling or live spend outcome. A live model call could cost more than the owner intends."
    reproduction: "Inspected the schema/config and release documentation; no model credential, rubric, cap, provider budget, or live model call exists."
    owner_next_action: "User: before any live qualification, supply an approved rubric and separate API credential through a secure UI and set a provider-side USD budget. Workflow lead: retain the explicit local call cap and document actual provider billing evidence after an authorized check."
  - id: "AUD-0907"
    severity: "medium"
    result: "risk"
    title: "A later repeated successful GHL tag request is not suppressed by a provider idempotency key."
    evidence:
      - "src/workflow_automation/modules/crm/ghl_contact_tags.py: effect key is scoped to Location/contact and guard holds concurrent/unknown effects; successful effect claim does not establish provider idempotency for later calls."
      - "docs/modules/ghl-contact-tags.md: explicitly disclaims provider idempotency and directs operators to inspect tags before ambiguous retries."
      - "tests/integration/ghl_contact_tags_postgres.py: verifies one request during same-contact overlap and holds a simulated timeout for reconciliation."
    impact: "The guard reduces same-database concurrent and uncertain duplicate writes. A separately retried confirmed-success workflow may still issue another additive tag request; this module alone does not guarantee exactly-once tag effects."
    reproduction: "Source review and synthetic HTTP/PostgreSQL integration evidence; no live HighLevel behavior or independent-writer interaction was tested."
    owner_next_action: "Workflow lead: keep the module uncomposed until account policy is approved; for job use, read/compare existing tags or add a durable payload-aware completed-effect policy and test repeated successful runs."
  - id: "AUD-0908"
    severity: "medium"
    result: "fail"
    title: "Lead-specific failure alerting, dead-letter/recovery operation, and retry scheduling are missing."
    evidence:
      - "docs/modules/lead-management-reference.md: no CRM outbox and no follow-up suppression scheduler; workflow terminates at lead storage."
      - "docs/project-state/verification.md: no lead-specific alert, DLQ/recovery operator flow, automatic retry scheduler, or capacity test."
      - "GHL tag and qualification adapters return bounded/reconciliation states but do not implement a delivery scheduler or operator alert path."
    impact: "Module-level error codes and durable holds aid diagnosis, but the brief asks operators to receive failure notifications and resolve common failures. The composed system has no tested alert/recovery route."
    reproduction: "Inspected lead graph, provider adapters, and verification gaps; no alert or recovery event was triggered end-to-end."
    owner_next_action: "Workflow lead: design a lead-specific failure/outbox or error workflow with bounded retry, reconciliation instructions, and alert delivery; verify transient, permanent, unknown, and partial failure paths synthetically."
  - id: "AUD-0909"
    severity: "low"
    result: "pass"
    title: "Release 0.9.0 local unit suite passes independently."
    evidence:
      - "Independent command: `uv run pytest -q` in Workflow_Automation_Tool; result: 159 passed, 1 StarletteDeprecationWarning, 1.28s."
    impact: "Supports local unit/API contract behavior only; does not prove provider behavior or n8n runtime."
    reproduction: "Ran the command from the project directory during this audit."
    owner_next_action: "Workflow lead: retain the known deprecation note and continue distinguishing unit evidence from integration/live acceptance."

