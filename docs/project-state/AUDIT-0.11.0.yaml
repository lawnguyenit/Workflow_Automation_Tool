findings:
  - id: AUD-01101
    severity: high
    disposition: open
    title: "The full business outcome is not composed or demonstrated."
    evidence:
      - "Current lead graph ends at PostgreSQL; GHL and follow-up components remain separate."
      - "No live end-to-end source → qualification → CRM → follow-up run or user acceptance."
    impact: "The Upwork acceptance criterion remains unmet."
    next_gate: "Obtain required account access and business rules, compose the graph, and exercise the agreed acceptance matrix."
  - id: AUD-01102
    severity: high
    disposition: configuration_needed
    title: "Forms poller is inactive and lacks required credentials."
    evidence:
      - "n8n persisted workflow is inactive and has no credentials; Google Form ID remains a placeholder."
      - "The local API has WORKFLOW_API_KEY configured, but exported n8n HTTP nodes contain no API bearer credential for MOCK/REAL."
      - "Selected Cloud project has not been configured for Forms API OAuth; no OAuth credential exists in n8n."
    impact: "The poller cannot read Forms, and database-writing modes will fail API authorization until owner-controlled credentials are configured."
    next_gate: "Owner selects Cloud project path, completes read-only OAuth, enters the Form ID locally, and creates/assigns a protected API bearer credential; then run only synthetic test data."
  - id: AUD-01103
    severity: high
    disposition: open
    title: "Follow-up stop gate and sender are not connected to authoritative events."
    evidence:
      - "The standalone gate does not produce reply/booking/opt-out events or send messages."
      - "No connected sender checks gate state immediately before dispatch."
    impact: "Duplicate or disallowed follow-ups have not been prevented in an actual message path."
    next_gate: "Approve enrollment/content and lifecycle event sources, then compose and test a fail-closed pre-send gate."
  - id: AUD-01104
    severity: high
    disposition: open
    title: "Lead-level alerting and operator recovery remain incomplete."
    evidence:
      - "No lead alert destination, dead-letter path, recovery owner, or failure-and-replay exercise is verified."
    impact: "A safely stopped execution may still remain unnoticed or unrecoverable by the operator."
    next_gate: "Choose owner/destination and implement alert, reconciliation, and safe replay steps."
  - id: AUD-01105
    severity: medium
    disposition: documented_risk
    title: "Lease expiry and timestamp polling are bounded, not exactly-once."
    evidence:
      - "Checkpoint fencing blocks stale commits; it cannot cancel downstream work already in progress."
      - "The 900-second lease renews after page retrieval, not during a long per-response batch."
      - "Inclusive timestamp polling can replay equal-timestamp events; storage event identity is the safety boundary."
    impact: "Long runs may replay work, so later remote side effects need independent idempotency and reconciliation."
    next_gate: "Keep the low-volume bound; before scale-up, measure batch duration, renew during processing if needed, and verify each side-effect guard."
  - id: AUD-01106
    severity: medium
    disposition: open
    title: "Follow-up HMAC key rotation/loss still lacks recovery tooling."
    evidence:
      - "The standalone gate stores HMAC-derived identities and has no key migration tool; earlier audit AUD-0104 identifies the same risk."
    impact: "Lost/rotated key can make prior suppression state unreachable and permit an unsafe re-enrollment without reconciliation."
    next_gate: "Define key custody/backup and controlled migration or disable sending until manual state reconciliation."
post_audit_corrections:
  - item: "Fresh-init last_action CHECK constraint was weaker than migration 006."
    state: "resolved and verified after independent audit"
    evidence:
      - "infra/postgres/init.sql and infra/postgres/migrations/006-source-poll-checkpoint.sql now enforce the same COMMITTED/RELEASED values."
      - "Migration 006 reapplied successfully; pg_get_constraintdef confirmed the allowed states."
      - "A fresh temporary database initialized with init.sql showed the same CHECK; it was dropped after verification."
