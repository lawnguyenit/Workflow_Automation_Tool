    result: "not_tested"
    evidence: "Google Forms workflow remains inactive with placeholder Form ID and no OAuth; private Form is unpublished and the auditor found zero poller executions."
    limitation: "No Google Forms API request or real response was read."
    owner_next_action: "Owner configures a Google Cloud OAuth app and read-only n8n credential after choosing the Cloud setup path, then runs an owner-observed synthetic response."
  - criterion: "Validate required fields and normalize contact information"
    result: "pass"
    evidence: "Forms mapper → lead intake → qualification/review → PostgreSQL composition exists; prior audit and current unit/API suite cover bounded normalization and missing/invalid-field review."
    limitation: "No live Form schema or respondent data was tested; phone country/E.164 assumptions are not invented."
    owner_next_action: "Reconfirm field mappings against the live Forms API schema once OAuth is configured."
  - criterion: "Prevent duplicate submissions and CRM records/messages"
    result: "risk"
    evidence: "Stable formId:responseId storage key and the source-poll lease support replay safety for the current PostgreSQL-only graph; integration harness reports STORED/DUPLICATE/conflict outcomes."
    limitation: "This does not establish same-person dedupe or exactly-once GHL/opportunity/message effects; downstream adapters remain uncomposed."
    owner_next_action: "Keep each future remote write behind its own durable idempotency and unknown-outcome reconciliation contract."
  - criterion: "AI extraction, summary, and classification; missing data flagged"
    result: "not_tested"
    evidence: "Qualification module and manual-review fallback exist."
    limitation: "No client-approved rubric, OpenAI API credential, monetary limit, or live model result."
    owner_next_action: "Owner supplies rubric, acceptable labels, privacy decision, API credential, and provider-side spend cap before live calls."
  - criterion: "Create/update GHL contacts, custom fields, tags, and opportunities"
    result: "decision_needed"
    evidence: "Contact/tag/opportunity adapters exist independently with synthetic tests."
    limitation: "No GHL account/Location, OAuth/token scopes, matching policy, approved custom fields/tags, pipeline/stage IDs, or composed CRM edge."
    owner_next_action: "Owner provisions a test Location and approves mappings and duplicate/opportunity rules."
  - criterion: "Send approved acknowledgement/follow-up and stop on reply/book/opt-out/pause"
    result: "not_tested"
    evidence: "A standalone suppression gate and separate Gmail sender module exist."
    limitation: "No enrollment/content/timing policy, booking link, authoritative stop-event producers, sender credential, or pre-send composition."
    owner_next_action: "Owner approves message and enrollment policy, sender/channel, booking target, and lifecycle event sources; compose and exercise the gate before every send."
  - criterion: "Monitoring, bounded retry, alerts, failure recovery, and operator resolution"
    result: "fail"
    evidence: "Modules expose selected retry, fail-closed, and unknown-outcome states; the checkpoint bounds database waits and prevents stale cursor commits."
    limitation: "No lead-level alert, dead-letter/replay operator path, recovery owner, or end-to-end failure-and-recovery run."
    owner_next_action: "Choose an alert destination and recovery owner; compose and exercise alert, reconciliation, and safe replay."
  - criterion: "Export workflow without secrets, setup guide, and handover"
    result: "risk"
    evidence: "Committed source/module exports and setup documentation exist; revised n8n graph is inactive, placeholder-based, and credential-free."
    limitation: "No complete CRM/follow-up export or recorded client handover; n8n API bearer and Google OAuth have not been configured on the workflow."
    owner_next_action: "Complete owner-controlled credentials and mappings, then produce final secret-free exports and handover materials."
  - criterion: "Successful enquiry moves through qualification, CRM, and the correct follow-up"
    result: "fail"
    evidence: "The local lead graph ends at PostgreSQL; separate synthetic preview and database integration do not demonstrate one live business run."
    limitation: "No end-to-end source → model → GHL → follow-up run."
    owner_next_action: "Complete required account setup/composition, then run the agreed synthetic acceptance matrix."
  - criterion: "User acceptance"
    result: "decision_needed"
    evidence: "No acceptance decision for a full-scope workflow has been recorded."
    limitation: "The delivered local checkpoint/export is an implementation increment, not the full Upwork outcome."
    owner_next_action: "User reviews a complete, evidence-backed end-to-end result when all client-owned inputs are available."
